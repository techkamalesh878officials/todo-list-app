<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>To-Do List</h1>

      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task..."
          maxlength="120"
          aria-label="New task"
        />
        <button type="submit">Add</button>
      </form>

      <div class="toolbar">
        <div id="task-count" class="task-count">0 tasks</div>
        <div class="filters" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <button id="clear-completed" class="clear-btn" type="button">
        Clear completed
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
